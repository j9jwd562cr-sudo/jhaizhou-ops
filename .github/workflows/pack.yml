name: Reusable prepared-input build
on:
  workflow_call:
    inputs:
      prepared_input:
        description: Prepared package configuration as JSON
        type: string
        required: true
      source_repository:
        type: string
        default: jhaizhou-ops/d2r-mobile
      source_ref:
        type: string
        default: ''
    secrets:
      SOURCE_TOKEN:
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: d2r-build
  queue: max
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tools_commit: ${{ steps.tools.outputs.tools_commit }}
      input_revision: ${{ steps.input.outputs.input_revision }}
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the tools revision
        id: tools
        uses: jiayx/d2r-mobile-build/.github/actions/resolve-tools@main
        with:
          workflow: pack.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ steps.tools.outputs.tools_commit }}
          persist-credentials: false
      - name: Select the latest release or requested source
        id: source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN || github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python3 scripts/source/resolve.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ secrets.SOURCE_TOKEN || github.token }}
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - name: Record the selected source and build identity
        run: python3 scripts/source/configure.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the input downloader
        run: python -m pip install -r requirements.txt pillow==12.1.1 numpy==2.4.4
      - name: Resolve the prepared package checksum
        id: input
        env:
          PREPARED_INPUT: ${{ inputs.prepared_input }}
        run: python scripts/source/prepared.py resolve
      - name: Restore the original prepared package
        id: archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .prepared-downloads
          key: prepared-input-v1-${{ steps.input.outputs.input_revision }}
      - name: Download and verify the prepared package
        env:
          PREPARED_INPUT: ${{ inputs.prepared_input }}
          INPUT_REVISION: ${{ steps.input.outputs.input_revision }}
        run: python scripts/source/prepared.py download
      - name: Cache the completed download before preparing the build
        if: steps.archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .prepared-downloads
          key: ${{ steps.archive.outputs.cache-primary-key }}
      - name: Resolve the interface generation cache
        id: interface-key
        run: python scripts/source/runtime_assets.py ios
      - name: Restore matching interface resources
        id: interface
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .interface-cache
          key: ${{ steps.interface-key.outputs.interface_key }}
      - name: Restore the upstream PNG compressor
        id: png
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/png-zlib-ng-2.3.2
          key: png-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/png_backend.sh') }}
      - name: Prepare the upstream PNG compressor
        run: bash scripts/png_backend.sh
      - name: Cache the PNG compressor
        if: steps.png.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/png-zlib-ng-2.3.2
          key: ${{ steps.png.outputs.cache-primary-key }}
      - name: Verify compatibility and prepare current native sources
        env:
          LD_PRELOAD: ${{ github.workspace }}/.tools/png-zlib-ng-2.3.2/lib/libz.so.1
          TOOLS_COMMIT: ${{ steps.tools.outputs.tools_commit }}
          INPUT_REVISION: ${{ steps.input.outputs.input_revision }}
        run: python scripts/source/prepared.py prepare
      - name: Check interface cache space
        id: interface-budget
        if: steps.interface.outputs.cache-hit != 'true'
        run: python scripts/cache_budget.py .interface-cache interface
      - name: Cache verified interface resources
        if: steps.interface-budget.outputs.interface == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .interface-cache
          key: ${{ steps.interface-key.outputs.interface_key }}
      - name: Upload verified native build inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-source-inputs
          overwrite: true
          path: |
            outputs/native-inputs.tar.gz
            outputs/source-payload.zip
            outputs/source-input-report.json
            outputs/build-context.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  native:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        minimum: ['26.0', '18.0']
    env:
      INPUT_REVISION: ${{ needs.prepare.outputs.input_revision }}
      GH_TOKEN: ${{ github.token }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ needs.prepare.outputs.tools_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-source-inputs
          path: outputs
      - name: Select macOS 26 and iOS 26.4+ SDK
        id: xcode
        run: python3 scripts/source/select_xcode.py
      - name: Restore matching native compiler modules
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-module-cache
          key: native-modules-v1-${{ runner.arch }}-${{ matrix.minimum }}-${{ steps.xcode.outputs.toolchain }}
      - name: Prepare native build dependencies
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install PyYAML==6.0.2
          tar -xzf outputs/native-inputs.tar.gz
      - name: Compile and verify the IPA
        env:
          MINIMUM_IOS: ${{ matrix.minimum }}
          NATIVE_MODULE_CACHE_HIT: ${{ steps.modules.outputs.cache-hit }}
        run: |
          set -o pipefail
          .venv/bin/python scripts/source/build.py "$MINIMUM_IOS" 2>&1 | tee outputs/native-build.log
      - name: Check compiler cache budget
        id: budget
        if: steps.modules.outputs.cache-hit != 'true'
        run: python3 scripts/cache_budget.py
      - name: Save native compiler modules when space permits
        if: steps.modules.outputs.cache-hit != 'true' && steps.budget.outputs.native == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-module-cache
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Upload the verified IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IPA-ios${{ matrix.minimum }}
          overwrite: true
          path: |
            outputs/D2RMobile-*.ipa
            outputs/source*-report.json
            outputs/build-context.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [prepare, native]
    if: ${{ !cancelled() && needs.native.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INPUT_REVISION: ${{ needs.prepare.outputs.input_revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ needs.prepare.outputs.tools_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: IPA-ios*
          merge-multiple: true
          path: outputs
      - name: Publish to your Releases
        run: |
          python3 scripts/source/publish.py
      - name: Delete intermediate inputs after a successful build
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          repo, run = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']
          data = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'],text=True))
          for item in data['artifacts']:
              if item['name'] == 'native-source-inputs':
                  subprocess.run(['gh','api','--method','DELETE',f"repos/{repo}/actions/artifacts/{item['id']}"],check=True)
          PYCODE
