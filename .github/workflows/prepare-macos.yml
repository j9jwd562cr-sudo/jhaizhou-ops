name: Prepare macOS input
on:
  workflow_call:
    inputs:
      source_repository:
        type: string
        default: jhaizhou-ops/d2r-mobile
      source_ref:
        type: string
        default: ''
    secrets:
      GAME_ARCHIVE:
        required: true
      SOURCE_TOKEN:
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: d2r-macos-prepare
  queue: max
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
      J: '3'
    steps:
      - name: Resolve the tools revision
        id: tools
        uses: jiayx/d2r-mobile-build/.github/actions/resolve-tools@main
        with:
          workflow: prepare-macos.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jiayx/d2r-mobile-build
          ref: ${{ steps.tools.outputs.tools_commit }}
          persist-credentials: false
      - name: Select the latest release or requested source
        id: source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN || github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python3 scripts/source/resolve.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ secrets.SOURCE_TOKEN || github.token }}
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - name: Record the selected source and build identity
        run: python3 scripts/source/configure.py
      - name: Select the Apple toolchain
        id: xcode
        run: python3 scripts/source/select_xcode.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the archive downloader
        run: python -m pip install -r requirements.txt
      - name: Resolve input and generation cache keys
        id: plan
        env:
          GAME_ARCHIVE: ${{ secrets.GAME_ARCHIVE }}
          MACOS_TOOLCHAIN: ${{ steps.xcode.outputs.toolchain }}
        run: python scripts/macos.py plan
      - name: Restore the Mac preparation cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .macos-prepared
          key: ${{ steps.plan.outputs.prepared_key }}-schema2
      - name: Verify cached Mac inputs
        id: prepared
        env:
          MACOS_PREPARED_KEY: ${{ steps.plan.outputs.prepared_key }}
        run: python scripts/macos.py verify
      - name: Restore the original game archive
        id: archive
        if: steps.prepared.outputs.reused != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .game-downloads
          key: input-archive-v1-${{ steps.plan.outputs.input_revision }}
      - name: Verify the original archive or download it
        if: steps.prepared.outputs.reused != 'true'
        env:
          GAME_ARCHIVE: ${{ secrets.GAME_ARCHIVE }}
          INPUT_REVISION: ${{ steps.plan.outputs.input_revision }}
        run: python scripts/macos.py download
      - name: Check archive cache space
        id: archive-budget
        if: steps.prepared.outputs.reused != 'true' && steps.archive.outputs.cache-hit != 'true'
        run: python scripts/cache_budget.py .game-downloads archive
      - name: Save the completed archive before extraction
        if: steps.archive-budget.outputs.archive == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .game-downloads
          key: ${{ steps.archive.outputs.cache-primary-key }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.prepared.outputs.reused != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Install upstream generation tools
        if: steps.prepared.outputs.reused != 'true'
        run: |
          for tool in xcodegen spirv-cross; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
          xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          df -h .
      - name: Prepare game programs, Mac overlays and Metal libraries
        if: steps.prepared.outputs.reused != 'true'
        env:
          GAME_ARCHIVE: ${{ secrets.GAME_ARCHIVE }}
          INPUT_REVISION: ${{ steps.plan.outputs.input_revision }}
          MACOS_PREPARED_KEY: ${{ steps.plan.outputs.prepared_key }}
          MACOS_TOOLCHAIN: ${{ steps.xcode.outputs.toolchain }}
        run: python scripts/macos.py prepare
      - name: Check prepared cache space
        id: prepared-budget
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/cache_budget.py .macos-prepared macos
      - name: Save verified Mac build inputs
        if: steps.prepared-budget.outputs.macos == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .macos-prepared
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Export the Mac prepared package to your Releases
        env:
          MACOS_PREPARED_KEY: ${{ steps.plan.outputs.prepared_key }}
        run: python scripts/macos.py export
